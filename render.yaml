# Render has no native PHP runtime — Laravel must be deployed with Docker.
services:
  - type: web
    name: trainhub-api
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        value: https://traininghubtz.co.tz
      - key: CORS_ALLOWED_ORIGINS
        value: https://traininghubtz.co.tz,https://www.traininghubtz.co.tz,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "true"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: traininghubtz.co.tz,www.traininghubtz.co.tz,localhost:5173,127.0.0.1:5173,localhost:3000
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Mail: leaving this as "log" writes OTP codes to the log instead of
      # sending them. Render's free plan also blocks outbound ports 25/465/587,
      # so either use an SMTP provider on port 2525 or MAIL_MAILER=http.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_HTTP_PROVIDER
        sync: false
      - key: MAIL_HTTP_API_KEY
        sync: false
      # Set to a random string to enable GET /api/mail-check?token=...
      - key: MAIL_CHECK_TOKEN
        sync: false
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_URL
        value: https://pay.pesapal.com/v3
      - key: PESAPAL_MODE
        value: sandbox
